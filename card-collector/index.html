<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡片收藏簿｜蠟筆小新 × 吉伊卡哇</title><style>:root{--bg:#f7f8fc;--card:#fff;--ink:#1b2430;--muted:#747b87;--line:#e5e8ef;--blue:#4568ff;--soft:#eef2ff;--green:#177245}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:24px 16px 60px}.hero{background:linear-gradient(135deg,#fff,#edf2ff);border:1px solid var(--line);border-radius:26px;padding:28px}h1{margin:0 0 8px;font-size:clamp(30px,6vw,48px)}.sub{color:var(--muted);line-height:1.7}.stats,.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.pill,button,input,select{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 12px;font:inherit}.toolbar{position:sticky;top:0;z-index:5;background:rgba(247,248,252,.94);backdrop-filter:blur(12px);display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px;padding:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-height:370px}.img{aspect-ratio:4/3;background:#f0f2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.img img{width:100%;height:100%;object-fit:contain;background:#fff}.placeholder{color:#8a909b;text-align:center;padding:16px}.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.meta{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:var(--soft);color:#4057bb}.tag.gray{background:#f1f2f5;color:#5e6570}.tag.sourceTag{background:#eef8f2;color:#177245}.name{font-weight:750;line-height:1.45}.date,.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;margin-top:auto}.check{display:flex;gap:7px;align-items:center;flex:1}.check input{width:18px;height:18px}.source{font-size:13px;color:var(--blue);text-decoration:none}.owned{outline:2px solid rgba(23,114,69,.2)}.owned .img:after{content:"✓ 已收藏";position:absolute;top:9px;right:9px;background:var(--green);color:#fff;padding:5px 8px;border-radius:999px;font-size:12px}.notice{margin:18px 0;padding:14px 16px;background:#fff8de;border:1px solid #f2e3a3;border-radius:15px;font-size:14px;line-height:1.6}footer{margin-top:30px;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}</style></head><body><div class="wrap"><section class="hero"><div class="small">MY CARD COLLECTOR</div><h1>卡片收藏簿</h1><div class="sub">蠟筆小新 × 吉伊卡哇｜悠遊卡・一卡通・icash。直接勾選你已經有的卡，會保存在這台裝置的瀏覽器。</div><div class="stats"><span class="pill">總數 <b id="total">0</b></span><span class="pill">已收藏 <b id="ownedCount">0</b></span><span class="pill">還缺 <b id="missingCount">0</b></span><span class="pill">完成率 <b id="rate">0%</b></span><span class="pill">已有圖片 <b id="imageCount">0</b></span></div><div class="row"><button id="exportBtn">匯出收藏</button><button id="importBtn">匯入收藏</button><input id="importFile" type="file" accept="application/json" hidden><button id="clearBtn">清除勾選</button></div></section><div class="notice"><b>持續補圖版：</b>只放已核對過的商品圖；找不到精確圖的卡先留空，不再用相似圖代替。</div><div class="toolbar"><input id="q" placeholder="搜尋品名，例如：小白、兔兔、SuperCard"><select id="ip"><option value="">全部角色</option><option>蠟筆小新</option><option>吉伊卡哇</option></select><select id="issuer"><option value="">全部票證</option><option>悠遊卡</option><option>一卡通</option><option>icash</option></select><select id="year"><option value="">全部年份</option></select><select id="status"><option value="">全部狀態</option><option value="owned">已收藏</option><option value="missing">未收藏</option></select></div><div id="grid" class="grid"></div><footer>資料整理自悠遊卡、一卡通與 icash 官方公開資訊與可核實通路資料；此頁目前先作私人收藏核對使用。</footer></div><script>window.CARD_DATA=[];</script><script src="./data-1.js"></script><script src="./data-2.js"></script><script src="./data-3.js"></script><script src="./data-4.js"></script><script src="./data-5.js"></script><script>const DATA=window.CARD_DATA||[],KEY="taiwan-card-collector-v1";let owned=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"));const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));[...new Set(DATA.map(x=>x.date.slice(0,4)))].sort((a,b)=>b-a).forEach(y=>$('#year').insertAdjacentHTML('beforeend',`<option>${y}</option>`));function stats(){$('#total').textContent=DATA.length;$('#ownedCount').textContent=owned.size;$('#missingCount').textContent=Math.max(0,DATA.length-owned.size);$('#rate').textContent=DATA.length?Math.round(owned.size/DATA.length*100)+'%':'0%';$('#imageCount').textContent=DATA.filter(x=>x.image).length}function render(){const q=$('#q').value.trim().toLowerCase(),ip=$('#ip').value,issuer=$('#issuer').value,year=$('#year').value,status=$('#status').value;const list=DATA.filter(x=>(!q||x.name.toLowerCase().includes(q))&&(!ip||x.ip===ip)&&(!issuer||x.issuer===issuer)&&(!year||x.date.startsWith(year))&&(!(status==='owned')||owned.has(x.id))&&(!(status==='missing')||!owned.has(x.id))).sort((a,b)=>b.date.localeCompare(a.date));$('#grid').innerHTML=list.map(x=>`<article class="card ${owned.has(x.id)?'owned':''}"><div class="img">${x.image?`<img loading="lazy" src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.outerHTML='<div class=&quot;placeholder&quot;>圖片暫時無法載入</div>'">`:`<div class="placeholder">📇<br>圖片待補</div>`}</div><div class="body"><div class="meta"><span class="tag">${x.ip}</span><span class="tag gray">${x.issuer}</span>${x.imageSource?`<span class="tag sourceTag">${esc(x.imageSource)}</span>`:''}</div><div class="name">${esc(x.name)}</div><div class="date">發行／上架：${x.date}</div><div class="actions"><label class="check"><input type="checkbox" data-id="${x.id}" ${owned.has(x.id)?'checked':''}> 已收藏</label><a class="source" href="${x.source}" target="_blank" rel="noopener">來源 ↗</a></div></div></article>`).join('');document.querySelectorAll('[data-id]').forEach(el=>el.onchange=e=>{e.target.checked?owned.add(e.target.dataset.id):owned.delete(e.target.dataset.id);localStorage.setItem(KEY,JSON.stringify([...owned]));render()});stats()}['q','ip','issuer','year','status'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',render));$('#clearBtn').onclick=()=>{if(confirm('確定清除所有已收藏勾選？')){owned.clear();localStorage.removeItem(KEY);render()}};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({owned:[...owned]},null,2)],{type:'application/json'}));a.download='我的票證收藏.json';a.click()};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());owned=new Set(o.owned||[]);localStorage.setItem(KEY,JSON.stringify([...owned]));render()}catch{alert('匯入失敗')}};render();</script></body></html>
