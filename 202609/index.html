<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>9/18 蝦皮折扣碼專區</title>
  <style>
    :root{
      --orange:#ee4d2d;
      --orange2:#ff6a3d;
      --bg:#f6f7f9;
      --text:#222;
      --muted:#777;
      --line:#eee;
      --gray:#999;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      -webkit-user-select:none;
    }
    .view{display:none}
    .header{
      background:#fff;
      border-top:6px solid var(--orange);
      padding:20px 20px 38px;
      text-align:center;
      border-radius:0 0 24px 24px;
      box-shadow:0 4px 18px rgba(0,0,0,.04);
    }
    .brand{font-size:22px;font-weight:900;color:var(--orange);letter-spacing:1px;margin-bottom:5px}
    .subtitle{font-size:15px;font-weight:800;color:#555;margin-bottom:15px}
    .info{
      width:100%;max-width:300px;margin:auto;background:#fff;border:1px solid #eee;border-radius:12px;
      padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.02)
    }
    .tip{font-size:13px;color:#444;font-weight:600;line-height:1.6}
    .tip b{color:var(--orange);background:rgba(238,77,45,.08);padding:2px 6px;border-radius:5px}
    .updated{font-size:11px;color:#999;border-top:1px dashed #eee;margin-top:5px;padding-top:5px}
    .container{max-width:390px;margin:-24px auto 0;padding:0 12px 30px;position:relative}
    .card{
      background:#fff;border-radius:12px;margin-bottom:12px;border-left:4px solid var(--orange);
      box-shadow:0 2px 9px rgba(0,0,0,.035);overflow:hidden
    }
    .card-head{padding:14px 16px 10px}
    .card-title{font-size:17px;font-weight:900;display:flex;align-items:center;gap:7px}
    .card-desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
    .divider{height:1px;background:#f2f2f2;margin:0 16px}
    .actions{padding:10px 16px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .btn{
      appearance:none;border:1.5px solid var(--orange);background:#fff;color:var(--orange);
      border-radius:7px;padding:10px 6px;font-size:13px;font-weight:800;line-height:1.25;cursor:pointer
    }
    .btn:active{background:var(--orange);color:#fff;transform:scale(.98)}
    .btn.full{grid-column:1/-1}
    .social{text-align:center;margin:28px 0 16px}
    .social-title{font-size:13px;color:#999;margin-bottom:14px}
    .social-icons{display:flex;justify-content:center;gap:22px}
    .social-icons a{width:40px;height:40px;display:block}
    .social-icons img{width:100%;height:100%;object-fit:contain;border-radius:12px}
    .ended-card{background:#fff;border-radius:12px;padding:28px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
    .ended-title{font-size:19px;font-weight:900;margin:10px 0 8px}
    .ended-desc{font-size:14px;color:#888;line-height:1.6}
    .home{display:block;margin-top:18px;padding:12px;background:#333;color:#fff;text-decoration:none;border-radius:7px;font-weight:800}
    .note{
      background:#fff7f4;border:1px solid #ffd6ca;color:#a13b25;border-radius:9px;
      padding:10px 12px;font-size:12px;line-height:1.55;margin-bottom:12px
    }
  </style>
</head>
<body>
<script>
(function(){
  var myDomain='walletsa.github.io';
  var current=window.location.hostname;
  if(current.indexOf(myDomain)===-1 && current!=='' && current!=='localhost' && current!=='127.0.0.1'){
    window.location.href='https://'+myDomain+'/202609/';
  }
})();
</script>

<div id="active" class="view">
  <div class="header">
    <div class="brand">優惠資訊情報站</div>
    <div class="subtitle">🛍️ 蝦皮 9/18 會員日折扣碼專區</div>
    <div class="info">
      <div class="tip">點擊按鈕即可 <b>自動複製折扣碼</b><br>有提供連結時會再自動前往使用範圍</div>
      <div class="updated" id="updated">載入中...</div>
    </div>
  </div>

  <div class="container">
    <div class="note">目前先更新 9/18 已確認的折扣碼；其餘使用範圍連結會再補上。</div>
    <div id="couponList"></div>

    <div class="social">
      <div class="social-title">歡迎加入社群 掌握最新優惠</div>
      <div class="social-icons" id="social-active"></div>
    </div>
  </div>
</div>

<div id="ended" class="view">
  <div class="header" style="border-top-color:#999">
    <div class="brand" style="color:#999">優惠資訊情報站</div>
    <div class="subtitle">9/18 活動已結束</div>
  </div>
  <div class="container">
    <div class="ended-card">
      <div style="font-size:40px">👋</div>
      <div class="ended-title">本檔活動已結束！</div>
      <div class="ended-desc">加入社群，鎖定下一波折扣碼與優惠券</div>
      <a class="home" href="https://walletsa.github.io/202609/">查看最新資訊 →</a>
    </div>
    <div class="social">
      <div class="social-title">加入社群 不錯過下次優惠</div>
      <div class="social-icons" id="social-ended"></div>
    </div>
  </div>
</div>

<script>
const endTimeStr='2026-09-19 00:00:00';

const socialLinks={
  line:'https://lihi.cc/yrdYN',
  threads:'https://lihi.cc/u3Jse',
  facebook:'https://lihi.cc/Wu9Uv'
};

const coupons=[
  {
    icon:'👑',
    title:'社群賣家',
    desc:'9/18限定・數量有限，用完為止',
    buttons:[
      {text:'滿 $499 折 $40',code:'ZTAFF40',link:''},
      {text:'滿 $999 折 $100',code:'ZTAFF100',link:''}
    ]
  },
  {
    icon:'👗',
    title:'流行指定',
    desc:'9/18 00:00 開搶',
    buttons:[
      {text:'滿 $499 折 $30',code:'FSSHI18N',link:''},
      {text:'滿 $799 折 $60',code:'FSSHI18L',link:''},
      {text:'滿 $1,599 折 $120',code:'FSSHI18H',link:''}
    ]
  },
  {
    icon:'🛍️',
    title:'流行類別',
    desc:'9/18 00:00 開搶',
    buttons:[
      {text:'滿 $1,200 折 $90',code:'FSPO18N',link:''},
      {text:'滿 $2,000 折 $150',code:'FSPO18M',link:''},
      {text:'滿 $3,000 折 $200',code:'FSPO18H',link:''}
    ]
  },
  {
    icon:'👚',
    title:'女裝店家',
    desc:'9/1－9/30 女裝類別商品限定',
    buttons:[
      {text:'滿 $799 折 $50',code:'WANQ50M',link:''},
      {text:'滿 $1,199 折 $70',code:'WAOE70A',link:''}
    ]
  },
  {
    icon:'👕',
    title:'男裝商品',
    desc:'9/1－9/30 男生服飾商品適用',
    buttons:[
      {text:'滿 $599 折 $30',code:'MASEP2630',link:''},
      {text:'滿 $999 折 $50',code:'MASEP2650',link:''},
      {text:'滿 $1,599 折 $100',code:'MASEP26100',link:''}
    ]
  },
  {
    icon:'🎮',
    title:'休閒娛樂',
    desc:'9/18－9/24 加碼領券折上折',
    buttons:[
      {text:'滿 $599 折 $20',code:'LS2609A',link:''},
      {text:'滿 $1,200 折 $50',code:'LS2609B',link:''},
      {text:'滿 $2,000 折 $100',code:'LS2609C',link:''},
      {text:'滿 $2,800 折 $140',code:'LS2609D',link:''}
    ]
  },
  {
    icon:'🏃',
    title:'運動戶外',
    desc:'9/18－9/24 指定類別商品',
    buttons:[
      {text:'滿 $1,699 享95折',code:'26091K5PC',link:''},
      {text:'滿 $4,000 折 $240',code:'26094K2B4C',link:''},
      {text:'滿 $10,000 享94折',code:'26091W6PC',link:''},
      {text:'滿 $700 折 $40',code:'2609NDD40C',link:''}
    ]
  },
  {
    icon:'🐾',
    title:'寵物用品',
    desc:'全站滿 $699 免運／活動優惠請以頁面顯示為準',
    buttons:[
      {text:'前往寵物用品活動頁',code:'',link:'https://shopee.tw/m/petsday-260918'}
    ]
  }
];

function renderSocial(target){
  document.getElementById(target).innerHTML=
    '<a href="'+socialLinks.line+'" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/4/41/LINE_logo.svg"></a>'+
    '<a href="'+socialLinks.threads+'" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/0/01/Threads_%28app%29.svg"></a>'+
    '<a href="'+socialLinks.facebook+'" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg"></a>';
}

function handleCoupon(btn,code,link){
  const original=btn.innerHTML;
  const afterCopy=()=>{
    btn.innerHTML=code?'已複製！':'前往活動頁';
    btn.style.background='#ee4d2d';
    btn.style.color='#fff';
    if(link){setTimeout(()=>{window.location.href=link;},180);}
    else{setTimeout(()=>{btn.innerHTML=original;btn.style.background='';btn.style.color='';},900);}
  };
  if(code && navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(code).then(afterCopy).catch(()=>fallbackCopy(code,afterCopy));
  }else if(code){
    fallbackCopy(code,afterCopy);
  }else{
    afterCopy();
  }
}

function fallbackCopy(code,done){
  const t=document.createElement('textarea');
  t.value=code;t.style.position='fixed';t.style.left='-9999px';
  document.body.appendChild(t);t.select();
  try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(t);done();
}

(function(){
  renderSocial('social-active');
  renderSocial('social-ended');
  const now=new Date();
  const end=new Date(endTimeStr);
  if(now>=end){
    document.getElementById('ended').style.display='block';
    return;
  }
  document.getElementById('active').style.display='block';
  document.getElementById('updated').textContent=(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':00 更新';
  const list=document.getElementById('couponList');
  coupons.forEach(item=>{
    const card=document.createElement('div');
    card.className='card';
    let buttons='';
    item.buttons.forEach((b,i)=>{
      const full=item.buttons.length===1?' full':'';
      const safeCode=b.code.replace(/'/g,"\\'");
      const safeLink=b.link.replace(/'/g,"\\'");
      buttons+='<button class="btn'+full+'" onclick="handleCoupon(this,\''+safeCode+'\',\''+safeLink+'\')">'+b.text+(b.code?'<br><span style="font-size:11px;font-weight:700">'+b.code+'</span>':'')+'</button>';
    });
    card.innerHTML='<div class="card-head"><div class="card-title"><span>'+item.icon+'</span>'+item.title+'</div><div class="card-desc">'+item.desc+'</div></div><div class="divider"></div><div class="actions">'+buttons+'</div>';
    list.appendChild(card);
  });
})();
</script>
</body>
</html>
